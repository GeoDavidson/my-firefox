<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --card-bg: #1a1a1a;
      --card-hover: #222;
      --text: #e0e0e0;
      --subtext: #888;
      --radius: 10px;
      --shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f5f5;
        --card-bg: #fff;
        --card-hover: #f0f0f0;
        --text: #111;
        --subtext: #888;
        --shadow: 0 2px 12px rgba(0,0,0,0.08);
      }
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grid {
      display: grid;
      gap: 16px;
      padding: 32px;
    }

    a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px 12px;
      background: var(--card-bg);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--text);
      box-shadow: var(--shadow);
      transition: background 0.15s, transform 0.15s;
    }

    a:hover {
      background: var(--card-hover);
      transform: translateY(-2px);
    }

    .favicon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }

    .label {
      font-size: 12px;
      text-align: center;
      color: var(--subtext);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 110px;
    }

    .empty-hint {
      color: var(--subtext);
      font-size: 14px;
      text-align: center;
      max-width: 320px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <script src="newtab.js"></script>
</body>
</html>
